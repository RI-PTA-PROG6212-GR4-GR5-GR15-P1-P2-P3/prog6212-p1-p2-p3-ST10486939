name: Check Documentation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  check-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: docs folder does not exist."
            exit 1
          fi

          echo "SUCCESS: docs folder exists."

      - name: Check required files
        run: |
          if [ ! -f "docs/API Endpoint Pla.pdf" ]; then
            echo "ERROR: API Endpoint Pla.pdf is missing."
            exit 1
          fi

          if [ ! -f "docs/README.md" ]; then
            echo "ERROR: README.md is missing."
            exit 1
          fi

          if [ ! -f "docs/RaceDay SQL Script.sql" ]; then
            echo "ERROR: RaceDay SQL Script.sql is missing."
            exit 1
          fi

          if [ ! -f "docs/RaceDay system ERD.png" ]; then
            echo "ERROR: RaceDay system ERD.png is missing."
            exit 1
          fi

          if [ ! -f "docs/Role-based access matrix.pdf" ]; then
            echo "ERROR: Role-based access matrix.pdf is missing."
            exit 1
          fi

          if [ ! -f "docs/User roles.png" ]; then
            echo "ERROR: User roles.png is missing."
            exit 1
          fi

          if [ ! -f "docs/updated raceday systems.png" ]; then
            echo "ERROR: updated raceday systems.png is missing."
            exit 1
          fi

          echo "SUCCESS: All required documentation files are present."
