name: Validate Documentation

on:
  push:
  pull_request:

jobs:
  validate-docs:
    name: Validate docs folder
    runs-on: ubuntu-latest

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check docs folder
      run: |
        echo "Checking documentation folder..." 

        if [ ! -d "docs" ]; then
          echo "ERROR: docs folder does not exist."
          exit 1
        fi

        echo "SUCCESS: docs folder exists."

    - name: Check required documentation files
      run: |
        echo "Checking required documentation files..."

        required_files=(
          "docs/API.pdf"
          "docs/README.md"
          "docs/RaceDay SQL Script.sql"
          "docs/RaceDay system ERD.png"
          "docs/Role-based access matrix.pdf"
          "docs/User roles"
          "docs/updated raceday system.png"
        )

        missing_files=0

        for file in "${required_files[@]}"; do
          if [! -f "$file" ]; then
            echo "ERROR: Missing required file: $file"
            missing_files=1
          else
            echo "SUCCESS: Found: $file"
          fi
        done

        if [ "$missing_files" -eq 1 ]; then
          echo ""
          echo "Documentation validation FAILED."
          exit 1
        fi

        echo ""
        echo "Documenattion validation PASSED."
        echo "All required files are present."
